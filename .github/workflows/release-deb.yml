name: Release Debian package

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debian-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/.*version = "\([0-9][0-9.]*\)";.*/\1/p' src/version.hpp)
          [[ "${RELEASE_TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "${RELEASE_TAG}" = "${version}"

      - name: Build and test on Debian 11 baseline
        shell: bash
        run: |
          docker run --rm \
            --volume "${PWD}:/src" \
            --workdir /src \
            debian:bullseye-slim \
            sh -c '
              printf "%s\n" \
                "deb http://deb.debian.org/debian bullseye main" \
                "deb http://archive.debian.org/debian-security bullseye-security main" \
                > /etc/apt/sources.list &&
              apt-get -o Acquire::Check-Valid-Until=false -o Acquire::Retries=3 update &&
              DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
                cmake g++ ninja-build dpkg-dev file python3 ca-certificates &&
              cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release &&
              cmake --build build --parallel 4 &&
              ctest --test-dir build --output-on-failure &&
              cpack --config build/CPackConfig.cmake -G DEB
            '

      - name: Inspect package
        run: |
          dpkg-deb --info build/packages/tuntom_*.deb
          dpkg-deb --contents build/packages/tuntom_*.deb
          test "$(dpkg-deb --field build/packages/tuntom_*.deb Architecture)" = "${{ matrix.architecture }}"

      - name: Keep package as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tuntom-deb-${{ matrix.architecture }}-${{ github.run_id }}
          path: build/packages/tuntom_*.deb
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: debian-package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: tuntom-deb-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum tuntom_*.deb > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "${RELEASE_TAG}" dist/tuntom_*.deb dist/SHA256SUMS \
            --verify-tag --title "Tuntom ${RELEASE_TAG}" --generate-notes
