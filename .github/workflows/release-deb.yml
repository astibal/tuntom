name: Release Debian package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debian-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify release tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          version=$(sed -n 's/.*version = "\([0-9][0-9.]*\)";.*/\1/p' src/version.hpp)
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Build and test on Debian 11 baseline
        shell: bash
        run: |
          docker run --rm \
            --volume "${PWD}:/src" \
            --workdir /src \
            debian:bullseye-slim \
            sh -c '
              printf "%s\n" \
                "deb http://deb.debian.org/debian bullseye main" \
                "deb http://archive.debian.org/debian-security bullseye-security main" \
                > /etc/apt/sources.list &&
              apt-get -o Acquire::Check-Valid-Until=false -o Acquire::Retries=3 update &&
              DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
                cmake g++ ninja-build dpkg-dev file python3 ca-certificates &&
              cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release &&
              cmake --build build --parallel 4 &&
              ctest --test-dir build --output-on-failure &&
              cpack --config build/CPackConfig.cmake -G DEB
            '

      - name: Inspect package
        run: |
          dpkg-deb --info build/packages/tuntom_*.deb
          dpkg-deb --contents build/packages/tuntom_*.deb
          test "$(dpkg-deb --field build/packages/tuntom_*.deb Architecture)" = "${{ matrix.architecture }}"

      - name: Keep package as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tuntom-deb-${{ matrix.architecture }}-${{ github.run_id }}
          path: build/packages/tuntom_*.deb
          if-no-files-found: error

      - name: Attach package to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" build/packages/tuntom_*.deb --clobber
